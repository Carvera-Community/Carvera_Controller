name: Build and Release
on:
  push:
    branches:
      - develop
    tags:
      - "v*.*.*"

jobs:
  build-windows-artifacts:
    name: build-windows-${{ matrix.platform }}
    runs-on: windows-latest
    permissions:
      actions: read
      contents: read
    strategy:
      fail-fast: false
      matrix:
        platform: [win64]
        include:
          - platform: win64
            arch: x64
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12
        architecture: ${{ matrix.arch }}

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: windows

    - name: Install gettext via WinGet
      shell: pwsh
      run: winget install --id mlocati.GetText --exact --source winget --silent --accept-source-agreements --accept-package-agreements --disable-interactivity

    - name: Add gettext to PATH
      shell: pwsh
      run: Add-Content -Path $env:GITHUB_PATH -Value "$env:LOCALAPPDATA\Programs\gettext-iconv\bin"

    - name: "Install Windows-Mesa OpenGL DLL"
      run: |
        curl -L --output mesa.7z --url https://github.com/pal1000/mesa-dist-win/releases/download/24.2.5/mesa3d-24.2.5-release-msvc.7z
        7z x mesa.7z -o*
        powershell.exe mesa\\systemwidedeploy.cmd 1
    # PyInstaller needs to be able to run the python app to determine the dependencies
    # This can't be done without a graphics renderer, so we install the Windows-Mesa OpenGL DLL
    # to proviode that.

    - name: Build release
      shell: pwsh
      run: |
        if ($env:GITHUB_REF.StartsWith('refs/tags/')) {
          $version = $env:GITHUB_REF_NAME
        } else {
          $version = Get-Date -Format "yyyy.M.d"
        }
        poetry run python scripts/build.py --os windows --version $version

    - name: Upload unsigned artifact for SignPath
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      id: upload-unsigned
      uses: actions/upload-artifact@v4
      with:
        name: windows-unsigned-${{ matrix.platform }}
        path: ${{ github.workspace }}/dist/carveracontroller-community-*-windows-x64.exe
        retention-days: 1

    - name: Upload artifact
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: windows-assets-${{ matrix.platform }}
        path: ${{ github.workspace }}/dist/carveracontroller-community-*-windows-x64.exe
        retention-days: 2

  build-macos-artifacts:
    name: build-macos-${{ matrix.platform }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        platform: [ Intel, AppleSilicon ]
        include:
          - platform: Intel
            image: macos-15-intel
          - platform: AppleSilicon
            image: macos-14
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: macos

    - name: Install create-dmg
      run: brew install create-dmg

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        poetry run python scripts/build.py --os macos --version "$VERSION"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: macos-assets-${{ matrix.platform }}
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.dmg
        retention-days: 2

  build-ios-app:
    name: build-ios
    runs-on: macos-15
    if: startsWith(github.ref, 'refs/heads/develop')
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Cache build directory
      uses: actions/cache@v4
      with:
        path: |
          build
          dist
        key: ${{ runner.os }}-ios-build-${{ hashFiles('**/poetry.lock') }}
        restore-keys: |
          ${{ runner.os }}-ios-build-

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: ios

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        poetry run python scripts/build.py --os ios --version "$VERSION"

  build-linux-artifacts:
    name: build-linux-${{ matrix.platform }}
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        platform: [x64,arm64]
        include:
          - platform: x64
            image: ubuntu-22.04
          - platform: arm64
            image: ubuntu-22.04-arm
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: 3.12

      - name: Install poetry and dependencies
        uses: ./.github/actions/bootstrap-poetry
        with:
          os: linux

      - name: Install Linux prerequisites
        run: poetry run ./scripts/install_linux_prereqs.sh

      - name: Build release
        run: |
          if [[ $GITHUB_REF == refs/tags/* ]]; then
            VERSION=$GITHUB_REF_NAME
          else
            VERSION=$(date +'%Y.%m.%d')
          fi
          xvfb-run poetry run python scripts/build.py --os linux --version "$VERSION"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: linux-assets-${{ matrix.platform }}
          path: ${{ github.workspace }}/dist/carveracontroller-community-*.appimage
          retention-days: 2

  build-pypi-artifacts:
    name: build-python
    runs-on: ubuntu-24.04
    permissions:
      id-token: write
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0  # all history is required for the dynamic versioning plugin

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: linux

    - name: Install gettext
      run: sudo apt-get install -y gettext

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        poetry run python scripts/build.py --os pypi --version "$VERSION"

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: pypi-assets
        path: ${{ github.workspace }}/dist/*.whl
        retention-days: 2

    - name: Publish package to PyPI
      if: startsWith(github.ref, 'refs/tags/')
      uses: pypa/gh-action-pypi-publish@release/v1

  build-android-artifacts:
    name: build-android
    runs-on: ubuntu-22.04
    timeout-minutes: 70
    permissions:
      actions: read
      contents: read
    outputs:
      unsigned-artifact-id: ${{ steps.upload-unsigned-apk.outputs.artifact-id }}
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4

    - name: Cache Buildozer global directory
      uses: actions/cache@v4
      with:
        path: ~/.buildozer
        key: ${{ runner.os }}-buildozer-global
        restore-keys: |
          ${{ runner.os }}-buildozer-global

    - name: Cache Buildozer directory in app
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-app
        restore-keys: |
          ${{ runner.os }}-buildozer-app

    - name: Cache Android SDK
      uses: actions/cache@v4
      with:
        path: ~/.buildozer/android/platform/android-sdk
        key: ${{ runner.os }}-android-sdk
        restore-keys: |
          ${{ runner.os }}-android-sdk

    - name: Set up Python 3.12
      uses: actions/setup-python@v5
      with:
        python-version: 3.12

    - name: Install poetry and dependencies
      uses: ./.github/actions/bootstrap-poetry
      with:
        os: linux

    - name: Install Linux prerequisites
      run: poetry run ./scripts/install_linux_prereqs.sh

    # Set up Java 17 required by Gradle
    - name: Setup Java 17 required by Gradle
      uses: actions/setup-java@v3
      with:
        distribution: 'temurin'  # or 'zulu', 'liberica', etc.
        java-version: '17'

    - name: Install prereqs
      run: |
        poetry run ./scripts/install_android_prereqs.sh

    - name: Build release
      run: |
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=$GITHUB_REF_NAME
        else
          VERSION=$(date +'%Y.%m.%d')
        fi
        xvfb-run poetry run python scripts/build.py --os android --version "$VERSION" --automation

    - name: Upload unsigned APK for SignPath
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' }}
      id: upload-unsigned-apk
      uses: actions/upload-artifact@v4
      with:
        name: android-unsigned
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.apk
        retention-days: 1

    - name: Upload artifact
      if: ${{ vars.SIGNPATH_ORGANIZATION_ID == '' }}
      uses: actions/upload-artifact@v4
      with:
        name: android-assets
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.apk
        retention-days: 2

  build-docker-images:
    name: build-docker-images
    needs: [build-linux-artifacts]
    runs-on: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            image: ubuntu-24.04
          - platform: arm64
            image: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Linux AppImage artifacts
        uses: actions/download-artifact@v4
        with:
          name: linux-assets-${{ matrix.platform }}
          path: ./artifacts/

      - name: Copy AppImage to Docker build context
        run: |
          mkdir -p assets/packaging/Docker/artifacts/
          cp ./artifacts/*.appimage assets/packaging/Docker/artifacts/

      # TODO: Add support for more platforms with QEMU
      # https://github.com/docker/setup-qemu-action
      #- name: Set up QEMU
      #  uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/carvera-controller-${{ matrix.platform }}
          tags: |
            type=ref,event=tag
            type=raw,value=dev,enable=${{ github.ref == format('refs/heads/{0}', 'develop') }}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: assets/packaging/Docker
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/${{ matrix.platform == 'x64' && 'amd64' || matrix.platform }}

  sign-artifacts:
    name: sign-artifacts
    needs: [build-windows-artifacts, build-android-artifacts]
    if: ${{ always() && !cancelled() && vars.SIGNPATH_ORGANIZATION_ID != '' && (needs.build-windows-artifacts.result == 'success' || needs.build-android-artifacts.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 270
    permissions:
      actions: read
      contents: read
    defaults:
      run:
        shell: bash
    env:
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG || 'carvera-controller-community' }}
      # TODO: restore release-signing for tags after release-signing is setup
      SIGNPATH_SIGNING_POLICY_SLUG: test-signing
      SIGNPATH_WINDOWS_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_WINDOWS_ARTIFACT_CONFIGURATION_SLUG || 'windows-portable-exe' }}
      SIGNPATH_ANDROID_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_ANDROID_ARTIFACT_CONFIGURATION_SLUG || 'android-apk' }}
    steps:
    - name: Submit Windows SignPath signing request
      if: ${{ needs.build-windows-artifacts.result == 'success' }}
      id: signpath-windows
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ env.SIGNPATH_WINDOWS_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ needs.build-windows-artifacts.outputs.unsigned-artifact-id }}
        wait-for-completion: false

    - name: Submit Android SignPath signing request
      if: ${{ always() && !cancelled() && needs.build-android-artifacts.result == 'success' }}
      id: signpath-apk
      uses: signpath/github-action-submit-signing-request@v2
      with:
        api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
        organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
        signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
        artifact-configuration-slug: ${{ env.SIGNPATH_ANDROID_ARTIFACT_CONFIGURATION_SLUG }}
        github-artifact-id: ${{ needs.build-android-artifacts.outputs.unsigned-artifact-id }}
        wait-for-completion: false


    - name: Wait for SignPath signing and download artifacts
      if: ${{ always() && !cancelled() && (steps.signpath-windows.outputs.signing-request-id != '' || steps.signpath-apk.outputs.signing-request-id != '') }}
      env:
        SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
        WINDOWS_REQUEST_ID: ${{ steps.signpath-windows.outputs.signing-request-id }}
        ANDROID_REQUEST_ID: ${{ steps.signpath-apk.outputs.signing-request-id }}
        WAIT_TIMEOUT_SECONDS: "14400"
      run: |
        set -euo pipefail
        connector="https://githubactions.connectors.signpath.io"
        org="${SIGNPATH_ORGANIZATION_ID}"
        deadline=$((SECONDS + WAIT_TIMEOUT_SECONDS))
        names=()
        ids=()
        outdirs=()
        states=()
        if [ -n "${WINDOWS_REQUEST_ID}" ]; then
          names+=("Windows")
          ids+=("${WINDOWS_REQUEST_ID}")
          outdirs+=("${GITHUB_WORKSPACE}/signed-windows")
          states+=("pending")
        fi
        if [ -n "${ANDROID_REQUEST_ID}" ]; then
          names+=("Android")
          ids+=("${ANDROID_REQUEST_ID}")
          outdirs+=("${GITHUB_WORKSPACE}/signed-android")
          states+=("pending")
        fi

        pending_count() {
          local count=0
          local state
          for state in "${states[@]}"; do
            if [ "${state}" = "pending" ]; then
              count=$((count + 1))
            fi
          done
          echo "${count}"
        }

        while [ "$(pending_count)" -gt 0 ]; do
          if [ "${SECONDS}" -ge "${deadline}" ]; then
            echo "Timed out after ${WAIT_TIMEOUT_SECONDS}s waiting for: ${names[*]}" >&2
            exit 1
          fi
          for i in "${!names[@]}"; do
            if [ "${states[$i]}" != "pending" ]; then
              continue
            fi
            if ! body="$(curl -sS --fail -H "Authorization: Bearer ${SIGNPATH_API_TOKEN}" \
              "${connector}/${org}/SigningRequests/${ids[$i]}/Status?api-version=1.0")"; then
              echo "${names[$i]} status check failed; will retry"
              continue
            fi
            status="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status") or "")' <<<"${body}")"
            is_final="$(python3 -c 'import json,sys; print(str(json.load(sys.stdin).get("isFinalStatus", False)).lower())' <<<"${body}")"
            echo "${names[$i]} status: ${status} final=${is_final}"
            if [ "${is_final}" != "true" ]; then
              continue
            fi
            if [ "${status}" != "Completed" ]; then
              echo "${names[$i]} signing ended with status ${status}" >&2
              echo "${body}" >&2
              states[$i]="failed"
              continue
            fi
            mkdir -p "${outdirs[$i]}"
            curl -sS --fail -L -H "Authorization: Bearer ${SIGNPATH_API_TOKEN}" \
              -o "${outdirs[$i]}/signed.zip" \
              "${connector}/${org}/SigningRequests/${ids[$i]}/SignedArtifact?api-version=1.0"
            unzip -o "${outdirs[$i]}/signed.zip" -d "${outdirs[$i]}"
            echo "Downloaded and extracted ${names[$i]} signed artifact"
            states[$i]="completed"
          done
          if [ "$(pending_count)" -gt 0 ]; then
            sleep 15
          fi
        done

        failures=()
        for i in "${!names[@]}"; do
          if [ "${states[$i]}" != "completed" ]; then
            failures+=("${names[$i]}")
          fi
        done
        if [ "${#failures[@]}" -ne 0 ]; then
          echo "Signing failed for: ${failures[*]}" >&2
          exit 1
        fi

    - name: Stage signed Windows EXE
      if: ${{ always() && !cancelled() && steps.signpath-windows.outputs.signing-request-id != '' }}
      run: |
        set -euo pipefail
        mkdir -p dist
        signed="$(find "${GITHUB_WORKSPACE}/signed-windows" -type f -name 'carveracontroller-community-*-windows-x64.exe' | head -n 1)"
        if [ -z "${signed}" ]; then
          echo "Signed Windows EXE was not returned by SignPath" >&2
          find "${GITHUB_WORKSPACE}/signed-windows" -print >&2 || true
          exit 1
        fi
        cp "${signed}" "${GITHUB_WORKSPACE}/dist/"
        echo "Copied signed EXE: ${signed}"

    - name: Upload signed Windows artifact
      if: ${{ always() && !cancelled() && steps.signpath-windows.outputs.signing-request-id != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: windows-assets-win64
        path: ${{ github.workspace }}/dist/carveracontroller-community-*-windows-x64.exe
        retention-days: 2

    - name: Stage signed Android APK
      if: ${{ always() && !cancelled() && steps.signpath-apk.outputs.signing-request-id != '' }}
      run: |
        set -euo pipefail
        mkdir -p dist
        signed_apk="$(find "${GITHUB_WORKSPACE}/signed-android" -type f -name 'carveracontroller-community-*.apk' | head -n 1)"
        if [ -z "${signed_apk}" ]; then
          echo "Signed Android APK was not returned by SignPath" >&2
          find "${GITHUB_WORKSPACE}/signed-android" -print >&2 || true
          exit 1
        fi
        cp "${signed_apk}" "${GITHUB_WORKSPACE}/dist/"
        echo "Copied signed APK: ${signed_apk}"

    - name: Upload signed Android artifact
      if: ${{ always() && !cancelled() && steps.signpath-apk.outputs.signing-request-id != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: android-assets
        path: ${{ github.workspace }}/dist/carveracontroller-community-*.apk
        retention-days: 2

  publish-release:
    needs: [ build-windows-artifacts, build-macos-artifacts, build-linux-artifacts, build-pypi-artifacts, build-android-artifacts, sign-artifacts ]
    if: ${{ always() && !cancelled() && (needs.build-windows-artifacts.result == 'success' || needs.build-macos-artifacts.result == 'success' || needs.build-linux-artifacts.result == 'success' || needs.build-pypi-artifacts.result == 'success' || needs.build-android-artifacts.result == 'success') }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Deleting the old dev release means that on the Publish release step a new dev release is created putting it in the right chronological order
      - name: Delete old dev release (dev builds only)  
        if: startsWith(github.ref, 'refs/heads/develop')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Check if dev release exists and delete it
          if gh release view dev --repo ${{ github.repository }} 2>/dev/null; then
            gh release delete dev --repo ${{ github.repository }} --yes
          fi

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:  # Skip downloading docker images
          pattern: '*-assets*'

      - name: Generate dev release notes (dev builds only)
        if: startsWith(github.ref, 'refs/heads/develop')
        run: python3 ./scripts/dev_release_notes.py

      - name: Force move 'dev' tag to latest commit on develop (dev builds only)
        if: startsWith(github.ref, 'refs/heads/develop')
        run: |
          git tag -f dev
          git push origin dev --force

      - name: Publish release
        uses: softprops/action-gh-release@v2.2.2
        with:
          fail_on_unmatched_files: false
          files: |
            windows-assets-*/carveracontroller-community-*-windows-x64.exe
            macos-assets-*/carveracontroller-community-*.dmg
            linux-assets-*/carveracontroller-community-*.appimage
            pypi-assets/*.whl
            android-assets/carveracontroller-community-*.apk
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'dev' }}
          body_path: ${{ startsWith(github.ref, 'refs/tags/') && 'CHANGELOG.md' || 'dev-CHANGELOG.md' }} 
          prerelease: ${{ startsWith(github.ref, 'refs/tags/') && 'false' || 'true' }}
 